      d.querySelector('.up').onclick=e=>{e.preventDefault();move(i,-1)};d.querySelector('.down').onclick=e=>{e.preventDefault();move(i,1)};localize(d);return d;

    function renderSummary(d,w){d.querySelector('.summary-icon').innerHTML=summaryIcon(w);d.querySelector('.summary-text b').textContent=w.label;d.querySelector('.summary-text small').textContent=(w.visible===false?u('非表示 · ','Hidden · '):'')+(w.source==='total'?u('累計','Lifetime'):u('今回','Session'))+' · '+u(calcInfo[w.operation||'sum'][0],EN[calcInfo[w.operation||'sum'][0]]||calcInfo[w.operation||'sum'][0])+' · '+(w.terms||[]).length+u('件',' stats')}
    function syncCardRange(body,key,value){const range=body.querySelector('.'+key+'Range');if(range)range.value=value}
    function setCardVisibility(d,w){d.classList.toggle('is-hidden',w.visible===false);const b=d.querySelector('.visible-quick');b.classList.toggle('active',w.visible!==false);b.textContent=w.visible!==false?u('表示','Shown'):u('非表示','Hidden');renderSummary(d,w);updateRecommendedSize()}
    function setLabelVisibility(d,w){const b=d.querySelector('.label-quick');b.classList.toggle('active',w.labelVisible!==false);b.textContent=w.labelVisible!==false?u('項目','Label'):u('数字のみ','Value only')}
    function isGrouped(w){return ['ratio','share'].includes(w.operation)}
    function ensureTermRoles(w){(w.terms||[]).forEach((t,i)=>{if(!t.role)t.role=i===0?'a':'b'})}
    function termRole(w,i){if(!isGrouped(w))return Number(w.terms?.[i]?.factor)<0?'−':'＋';const role=w.terms?.[i]?.role||(i===0?'a':'b');if(w.operation==='ratio')return role==='a'?'A':'B';return role==='a'?u('対象','Target'):u('その他','Other')}
    function calcHelp(w){let text=u(calcInfo[w.operation||'sum'][1],EN[calcInfo[w.operation||'sum'][1]]||calcInfo[w.operation||'sum'][1]);if(!isGrouped(w))return text;const roles=(w.terms||[]).map((t,i)=>t.role||(i===0?'a':'b'));if(!roles.includes('a'))return text+u(' ⚠ 対象にする統計を1つ以上選んでください。',' ⚠ Select at least one target statistic.');if(w.operation==='ratio'&&!roles.includes('b'))return text+u(' ⚠ Bにする統計を1つ以上選んでください。',' ⚠ Select at least one B statistic.');return text}
    function deleteWidget(i,w){if(!confirm(u(`「${w.label}」を削除してもよいですか？`,`Delete “${w.label}”?`)))return;cfg.widgets.splice(i,1);renderCards();save()}
    function move(i,dir){const to=i+dir;if(to<0||to>=cfg.widgets.length)return;[cfg.widgets[i],cfg.widgets[to]]=[cfg.widgets[to],cfg.widgets[i]];renderCards();save()}
    function bindTermSearch(body,w){const input=body.querySelector('.term-search'),root=body.querySelector('.term-results');input.oninput=()=>{const q=input.value.trim();root.innerHTML='';if(!q)return;catalog.filter(x=>matchesSearch(x,q)).slice(0,12).forEach(x=>{const exact=(w.terms||[]).some(t=>t.stat===x.id),included=(w.terms||[]).some(t=>t.prefix&&x.id.startsWith(t.prefix));const d=document.createElement('div');d.className='result'+(exact?' already':'');d.innerHTML=`<div class="result-info"><b>${esc(x.name)}${exact?'<span class="badge">追加済み</span>':included?'<span class="badge">「すべて」に含む</span>':''}</b><small>${esc(x.type)}${included&&!exact?'・引き算などの補正用に追加できます':''}</small></div><button class="secondary" ${exact?'disabled':''}>${exact?'追加済み':included?'補正で足す':'足す'}</button>`;if(!exact)d.querySelector('button').onclick=()=>{w.terms.push({stat:x.id,factor:1,...(isGrouped(w)?{role:'b'}:{})});renderCards(w.id);save()};localize(d);root.append(d)})}}
    function addGroupToWidget(w,id){const g=groupDefs.find(x=>x.id===id),terms=groupTerms(g);const covered=stat=>(w.terms||[]).some(t=>t.stat===stat||(t.prefix&&stat.startsWith(t.prefix)));const added=terms.filter(t=>!covered(t.stat)).map(t=>({...t,...(isGrouped(w)?{role:'b'}:{})}));w.terms.push(...added);renderCards(w.id);save();flash(added.length?`${added.length}種類を追加しました`:'すべて追加済みです')}
    function previewAnimation(w){try{const doc=$('#preview').contentDocument,row=doc?.querySelector(`[data-widget="${CSS.escape(w.id)}"]`),value=row?.querySelector('.value');if(!value)throw new Error();value.style.setProperty('--anim-color',w.animationColor||cfg.accent);value.style.setProperty('--anim-duration',(Number(w.animationDuration)||450)+'ms');const cls='anim-'+(w.animationType||'color');value.classList.remove('anim-color','anim-pop','anim-glow');void value.offsetWidth;value.classList.add(cls)}catch{flash(u('カードを表示してから試してください','Show the card before previewing the animation'))}}
    function W(label,emoji,iconKind,iconId,terms,format='number',source='session'){label=u(label,EN[label]||label);return{id:crypto.randomUUID(),label,emoji,iconKind,iconId,source,operation:'sum',format,color:cfg.valueColor||'#2835f8',visible:true,labelVisible:cfg.labelVisible!==false,animationEnabled:format!=='time',animationType:'color',animationColor:cfg.accent,animationDuration:450,terms:terms.map(x=>typeof x==='string'?{stat:x,factor:1}:{...x,factor:x.factor??1})}}
    function calculated(w,operation,extra={}){for(const key of ['prefixText','suffixText'])if(extra[key]&&uiLanguage==='en')extra[key]=EN[extra[key]]||extra[key];Object.assign(w,{operation},extra);if(isGrouped(w))ensureTermRoles(w);return w}
    function applyContent(name){
      if(cfg.widgets.length&&!confirm(u('現在の表示カードをプリセットで置き換えますか？','Replace the current display cards with this preset?')))return;let p=[];
      const diamonds=['minecraft:mined|minecraft:diamond_ore','minecraft:mined|minecraft:deepslate_diamond_ore'];
      const oreShare=groupTerms(groupDefs.find(g=>g.id==='ores')).map(t=>({...t,role:diamonds.includes(t.stat)?'a':'b'}));
      if(name==='mining')p=[W('総採掘数','⛏','item','minecraft:diamond_pickaxe',[{prefix:'minecraft:mined|'}]),W('石・深層岩','🪨','block','minecraft:stone',['minecraft:mined|minecraft:stone','minecraft:mined|minecraft:deepslate']),W('ダイヤ鉱石','💎','block','minecraft:diamond_ore',diamonds),W('壊したツルハシ','🔨','item','minecraft:diamond_pickaxe',groupTerms(groupDefs.find(g=>g.id==='pickaxes')))];
      if(name==='miningGoal')p=[W('掘ったダイヤ','💎','block','minecraft:diamond_ore',diamonds),calculated(W('100個まであと','🎯','item','minecraft:diamond',diamonds),'remaining',{target:100,suffixText:' 個'}),calculated(W('1時間あたり','⏱','item','minecraft:clock',diamonds),'rate',{suffixText:' 個/時'}),calculated(W('鉱石のうちダイヤ','📈','item','minecraft:spyglass',oreShare),'share',{format:'percent'})];
      if(name==='hardcore')p=[W('プレイ時間','⏱','item','minecraft:clock',['minecraft:custom|minecraft:play_time'],'time','total'),W('生存時間','❤️','item','minecraft:totem_of_undying',['minecraft:custom|minecraft:time_since_death'],'time','total'),W('死んだ回数','💀','item','minecraft:skeleton_skull',['minecraft:custom|minecraft:deaths'],'number','total'),W('Mob討伐','⚔','item','minecraft:diamond_sword',['minecraft:custom|minecraft:mob_kills'])];
      if(name==='building')p=[W('作業時間','⏱','item','minecraft:clock',['minecraft:custom|minecraft:play_time'],'time'),W('石系ブロック使用','🧱','block','minecraft:stone',['minecraft:used|minecraft:stone','minecraft:used|minecraft:cobblestone','minecraft:used|minecraft:stone_bricks']),W('木材使用','🪵','block','minecraft:oak_planks',groupTerms(groupDefs.find(g=>g.id==='planks'))),W('ガラス使用','✨','block','minecraft:glass',['minecraft:used|minecraft:glass'])];
      if(name==='mobChallenge')p=[W('総討伐数','⚔','item','minecraft:diamond_sword',[{prefix:'minecraft:killed|'}]),calculated(W('1時間あたり','⏱','item','minecraft:clock',[{prefix:'minecraft:killed|'}]),'rate',{suffixText:' 体/時'}),calculated(W('500体まであと','🎯','item','minecraft:target',[{prefix:'minecraft:killed|'}]),'remaining',{target:500,suffixText:' 体'}),calculated(W('クリーパーの割合','💥','item','minecraft:gunpowder',['minecraft:killed|minecraft:creeper','minecraft:killed|minecraft:zombie','minecraft:killed|minecraft:skeleton','minecraft:killed|minecraft:spider']),'share',{format:'percent'})];
      if(name==='relaxed')p=[W('釣った魚','🎣','item','minecraft:fishing_rod',['minecraft:custom|minecraft:fish_caught']),W('動物を繁殖','🐄','item','minecraft:wheat',['minecraft:custom|minecraft:animals_bred']),W('村人との取引','💚','item','minecraft:emerald',['minecraft:custom|minecraft:traded_with_villager']),W('ベッドで寝た回数','🛏','item','minecraft:red_bed',['minecraft:custom|minecraft:sleep_in_bed'])];
      cfg.widgets=p;syncBulkColors();renderCards();save();showTab('stats')
    }
    function measuredOverlaySize(visible){try{const doc=$('#preview').contentDocument,view=doc?.querySelector('#view'),panel=doc?.querySelector('.panel'),rows=doc?.querySelectorAll('[data-widget]');if(!view||view.hidden||!panel||rows.length!==visible)return null;const box=panel.getBoundingClientRect();return{width:Math.ceil(Math.max(box.width,panel.scrollWidth)+8),height:Math.ceil(Math.max(box.height,panel.scrollHeight)+8)}}catch{return null}}
    function updateRecommendedSize(){fitPreview();const visible=(cfg.widgets||[]).filter(w=>w.visible!==false).length,columns=Math.max(1,Math.min(Number(cfg.columns)||1,Math.max(visible,1))),rowCount=Math.max(visible?1:0,Math.ceil(visible/columns));const fallbackWidth=Math.ceil((Number(cfg.panelPadding)||0)*2+columns*(Number(cfg.itemWidth)||460)+(columns-1)*(Number(cfg.columnGap)||0)+(Number(cfg.borderWidth)||0)*2+16);let fallbackHeight=(Number(cfg.panelPadding)||0)*2+(Number(cfg.borderWidth)||0)*2+16;if(cfg.showTitle!==false)fallbackHeight+=(Number(cfg.titleSize)||34)*1.3+10;for(let row=0;row<rowCount;row++){const rowWidgets=(cfg.widgets||[]).filter(w=>w.visible!==false).slice(row*columns,(row+1)*columns),affix=Math.max(0,...rowWidgets.flatMap(w=>[Number(w.prefixSize)||0,Number(w.suffixSize)||0]));fallbackHeight+=Math.max(Number(cfg.iconSize)||44,(Number(cfg.valueSize)||40)*1.25,(Number(cfg.labelSize)||26)*1.25,affix*1.25)+(Number(cfg.itemGap)||0)*2+2}const measured=measuredOverlaySize(visible),width=measured?.width||fallbackWidth,height=measured?.height||Math.ceil(fallbackHeight);$('#recommendedSize').textContent=u(`幅 ${width} × 高さ ${height}`,`Width ${width} × Height ${height}`);$('#dimensionNote').textContent=measured?u(`右のプレビューを測った値です。OBSでは幅 ${width}、高さ ${height} を入力してください。`,`Measured from the preview. Enter width ${width} and height ${height} in OBS.`):u(`表示中 ${visible}項目・${columns}列から計算した安全値です。`,`Safe size calculated for ${visible} cards in ${columns} columns.`)}
    function normalizeConfig(value){if(!value||typeof value!=='object'||!Array.isArray(value.widgets))throw new Error(u('表示カードが見つかりません','No display cards found'));const next={...defaults,...value};next.customPresets=Array.isArray(next.customPresets)?next.customPresets:[];next.widgets=next.widgets.map(w=>({...w,id:w.id||crypto.randomUUID(),terms:Array.isArray(w.terms)?w.terms:[]}));return next}
    function refreshEditor(){syncGlobals();syncBulkColors();renderRanges();renderCards();renderCustomPresets();refreshPresetSelection();updateRecommendedSize()}
    function bindBackup(){$('#exportConfig').onclick=()=>{const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='minestats-viewer-settings.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);flash(u('設定ファイルを保存しました','Settings file saved'))};$('#importConfig').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>1000000){flash(u('設定ファイルが大きすぎます','Settings file is too large'));return}try{const next=normalizeConfig(JSON.parse(await file.text()));if(!confirm(u('現在の設定を、読み込んだ設定で置き換えますか？','Replace the current settings with the imported file?')))return;cfg=next;$('#uiLanguage').value=cfg.uiLanguage||'auto';uiLanguage=resolveLanguage();refreshEditor();localize();save();flash(u('設定を読み込みました','Settings imported'))}catch(err){flash(u('この設定ファイルは読み込めません','Could not import this settings file'))}}}
    function updateUndoButton(){$('#undoTop').disabled=!pendingUndo&&!undoStack.length}
    async function undoLast(){const previous=pendingUndo??undoStack.pop();if(!previous)return;clearTimeout(saveTimer);pendingUndo=null;try{cfg=normalizeConfig(JSON.parse(previous));$('#uiLanguage').value=cfg.uiLanguage||'auto';uiLanguage=resolveLanguage();refreshEditor();localize();const body=JSON.stringify(cfg),r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body});if(!r.ok)throw new Error();lastPersisted=body;$('#saveState').classList.add('online');$('#saveState span:last-child').textContent=u('保存済み','Saved');flash(u('一つ前の状態に戻しました','Restored the previous state'))}catch{flash(u('元に戻せませんでした','Could not undo'))}updateUndoButton()}
    function save(){updateRecommendedSize();const state=$('#saveState'),body=JSON.stringify(cfg);if(body===lastPersisted)return;if(pendingUndo===null)pendingUndo=lastPersisted;updateUndoButton();state.classList.remove('online');state.querySelector('span:last-child').textContent=u('保存中…','Saving…');clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{const next=JSON.stringify(cfg);try{const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:next});if(!r.ok)throw new Error();if(pendingUndo&&pendingUndo!==next){undoStack.push(pendingUndo);if(undoStack.length>30)undoStack.shift()}lastPersisted=next;pendingUndo=null;updateUndoButton();state.classList.add('online');state.querySelector('span:last-child').textContent=u('保存済み','Saved')}catch{state.querySelector('span:last-child').textContent=u('保存エラー','Save failed');flash(u('保存に失敗しました','Could not save settings'))}},180)}
    async function pollConnection(){const state=$('#connection'),reset=$('#resetSession');try{const d=await fetch('/api/stats').then(r=>r.json());state.classList.toggle('online',d.connected);state.querySelector('span:last-child').textContent=d.connected?u('Minecraft接続中','Minecraft connected'):u('ワールド未接続','Not in a world');reset.disabled=!d.connected}catch{state.classList.remove('online');state.querySelector('span:last-child').textContent=u('接続エラー','Connection error');reset.disabled=true}}
    async function resetSession(){if(!confirm(u('「今回」の数字をすべて0から数え直しますか？\nMinecraft本体の累計統計は消えません。','Reset all session values to zero?\nLifetime Minecraft statistics will not be deleted.')))return;try{const r=await fetch('/api/session/reset',{method:'POST'});if(!r.ok)throw new Error();flash(u('今回の数字を0にしました','Session values reset to zero'))}catch{flash(u('ワールドへ入ってから実行してください','Join a world before resetting the session'))}}
    async function copyUrl(){try{await navigator.clipboard.writeText(OBS_URL);flash(u('OBS URLをコピーしました','OBS URL copied'))}catch{prompt(u('このURLをコピーしてください','Copy this URL'),OBS_URL)}}
    function flash(text){const el=$('#toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1300)}
    init();
  </script>
